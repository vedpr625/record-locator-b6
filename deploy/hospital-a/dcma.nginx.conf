# Hospital A (Homagama) - nginx site for dcma.duckdns.org
#   /             -> OHIF viewer (container, port 8888)
#   /ris/         -> Hospital RIS (Java, port 8081, CONTEXT_PATH=/ris)
#   /orthanc/     -> Orthanc REST/DICOMweb (port 8042, localhost only)
#   /dcm4chee-arc/ -> dcm4chee UI + REST (port 8080)
# Install: sudo cp dcma.nginx.conf /etc/nginx/sites-enabled/dcma && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dcma.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dcma.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/dcma.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dcma.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Large DICOM uploads
    client_max_body_size 2G;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    # dcm4chee-arc web UI + REST API
    location /dcm4chee-arc/ {
        proxy_pass         http://localhost:8080/dcm4chee-arc/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # Orthanc DICOMweb (used by OHIF). ^~ so no regex location can capture it.
    location ^~ /orthanc/ {
        proxy_pass            http://127.0.0.1:8042/;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering       off;
    }

    # RIS UI (runs with CONTEXT_PATH=/ris)
    location = /ris { return 301 /ris/; }
    location /ris/ {
        proxy_pass         http://127.0.0.1:8081/ris/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OHIF viewer at the root
    location / {
        proxy_pass         http://127.0.0.1:8888;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
