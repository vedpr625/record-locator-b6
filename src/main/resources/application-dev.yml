spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:record_locator;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

rl:
  orthanc:
    base-url: http://localhost:8042
