server:
  port: ${PORT:8081}
  # Set CONTEXT_PATH=/ris to serve the app under a sub-path behind a reverse proxy
  servlet:
    context-path: ${CONTEXT_PATH:}
  forward-headers-strategy: framework

spring:
  thymeleaf:
    cache: false

hospital:
  name: ${HOSPITAL_NAME:Homagama Hospital}
  short-code: ${HOSPITAL_SHORT_CODE:HMG}
  facility-id: ${FACILITY_ID:29751}
  timezone: ${HOSPITAL_TZ:Asia/Colombo}

# Worklist: 0 = today only; N = also show still-SCHEDULED items from the last N days
worklist:
  days-back: ${WORKLIST_DAYS_BACK:0}

# dcm4chee MWL C-FIND + REST API
dcm4chee:
  host: ${DCM4CHEE_HOST:localhost}
  port: ${DCM4CHEE_PORT:11112}
  ae-title: ${DCM4CHEE_AE_TITLE:WORKLIST}
  calling-ae: ${CALLING_AE:HOSPITAL-RIS}
  rest-url: ${DCM4CHEE_REST_URL:http://localhost:8080/dcm4chee-arc}

# Orthanc REST
orthanc:
  url: ${ORTHANC_REST_URL:http://localhost:8042}

# National RL
national-rl:
  url: ${NATIONAL_RL_URL:http://localhost:8082}

# HHMIS study-done notification
hhmis:
  rest-url: ${HHMIS_REST_URL:https://nova-qa-ris.external.dxdyhosting.xyz}
  viewer-base-url: ${HHMIS_VIEWER_URL:https://dcma.duckdns.org/ohif/viewer}
  bearer-token: ${HHMIS_BEARER_TOKEN:}

# Sample X-ray images on server
sample:
  images:
    path: ${SAMPLE_IMAGES_PATH:/opt/ris/sample-images}
