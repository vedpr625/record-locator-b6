# ── Test profile ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway runs against H2 — PostgreSQL-specific syntax won't work,
# so we keep migrations ANSI-SQL-compatible (they are).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable OAuth2 token validation in tests — tests provide mock JWTs.
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Disable Orthanc poller and OpenSearch initializer in tests.
rl.orthanc.enabled=false
rl.opensearch.enabled=false

# Spring Boot test uses random port so MockMvc works fine.
server.port=0

# Suppress most logs in tests
logging.level.root=WARN
logging.level.lk.gov.moh.dhp=INFO

# Required properties with defaults — set explicitly for test clarity
rl.home-community-id=urn:oid:2.16.840.1.113883.3.DHP.TEST
rl.consent.default-accessible=true
rl.security.mtls-header-enabled=false
